<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | CO-WORKERS</title>
  <link rel="stylesheet" href="css/main.css">
</head>

<body>

<!-- HEADER -->
<header class="header">
  <a href="index.html" class="logo">CO-WORKERS</a>

  <form class="search">
    <input type="search" placeholder="Buscar">
  </form>

  <button class="header-button" aria-label="Opciones de usuario"></button>
</header>


<!-- CONTENIDO PRINCIPAL -->
<main class="main-container">

  <section class="register-container" aria-labelledby="register-title">

    <header class="register-header">
      <h1 id="register-title">Únete a CO-WORKERS</h1>
      <p>Crea tu cuenta y empieza a conectar con otros profesionales.</p>
    </header>

    <form id="register-form" novalidate>

      <fieldset>
        <legend>Datos de registro</legend>

        <p>
          <label for="username">Nombre de usuario</label>
          <input
                  type="text"
                  id="username"
                  name="username"
                  placeholder="Ej. sararomero"
                  required
                  minlength="3"
                  maxlength="20"
                  autocomplete="username"
                  aria-describedby="username-error"
          >
          <span class="error-message" id="username-error"></span>
        </p>

        <p>
          <label for="email">Correo electrónico</label>
          <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="ejemplo@correo.com"
                  required
                  maxlength="100"
                  autocomplete="email"
                  aria-describedby="email-error"
          >
          <span class="error-message" id="email-error"></span>
        </p>

        <fieldset>
          <legend>Teléfono (opcional)</legend>

          <p>
            <label for="phone-prefix">Prefijo telefónico</label>
            <select id="phone-prefix" name="phone-prefix">
              <option value="+34" selected>España (+34)</option>
              <option value="+33">Francia (+33)</option>
              <option value="+49">Alemania (+49)</option>
              <option value="+39">Italia (+39)</option>
              <option value="+44">Reino Unido (+44)</option>
              <option value="+351">Portugal (+351)</option>
              <option value="+1">Estados Unidos (+1)</option>
            </select>

            <label for="phone">Número de teléfono</label>
            <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Ej. 612345678"
                    inputmode="numeric"
                    pattern="[0-9]{9}"
                    minlength="9"
                    maxlength="9"
                    autocomplete="tel-national"
                    aria-describedby="phone-error"
            >
            <span class="error-message" id="phone-error"></span>
          </p>
        </fieldset>

        <p>
          <label for="password">Contraseña</label>
          <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Introduce tu contraseña"
                  required
                  minlength="8"
                  maxlength="64"
                  autocomplete="new-password"
                  aria-describedby="password-error"
          >
          <span class="error-message" id="password-error"></span>
        </p>

        <p>
          <label for="confirm-password">Repetir contraseña</label>
          <input
                  type="password"
                  id="confirm-password"
                  name="confirm-password"
                  placeholder="Repite tu contraseña"
                  required
                  minlength="8"
                  maxlength="64"
                  autocomplete="new-password"
                  aria-describedby="confirm-password-error"
          >
          <span class="error-message" id="confirm-password-error"></span>
        </p>

        <p>
          <label for="birthdate">Fecha de nacimiento</label>
          <input
                  type="date"
                  id="birthdate"
                  name="birthdate"
                  required
                  autocomplete="bday"
                  aria-describedby="birthdate-error"
          >
          <span class="error-message" id="birthdate-error"></span>
        </p>

        <p>
          <input
                  type="checkbox"
                  id="terms"
                  name="terms"
                  required
                  aria-describedby="terms-error"
          >
          <label for="terms">
            Acepto las condiciones de uso y la política de privacidad.
          </label>
          <span class="error-message" id="terms-error"></span>
        </p>

      </fieldset>

      <button type="submit" class="button-primary">
        Crear cuenta
      </button>

    </form>

    <footer class="register-footer">
      <p>
        ¿Ya tienes una cuenta?
        <a href="login.html">Inicia sesión</a>
      </p>
    </footer>

  </section>

</main>

<script type="module" src="js/validacion.js"></script>

</body>
</html>
